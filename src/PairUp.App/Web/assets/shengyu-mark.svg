<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">声屿</title>
  <desc id="desc">透明玻璃球中，橙、紫、青色双峰音乐波形环绕成一座声岛。</desc>
  <!-- Original vector artwork for Shengyu, drawn from the user's selected visual direction. -->
  <defs>
    <radialGradient id="glass" cx=".32" cy=".2" r=".88">
      <stop stop-color="#fff" stop-opacity=".94"/>
      <stop offset=".38" stop-color="#eef9ff" stop-opacity=".24"/>
      <stop offset=".75" stop-color="#a4cce9" stop-opacity=".12"/>
      <stop offset=".92" stop-color="#b1bee7" stop-opacity=".38"/>
      <stop offset="1" stop-color="#f5fbff" stop-opacity=".86"/>
    </radialGradient>
    <linearGradient id="rim" x1=".12" y1="0" x2=".82" y2="1">
      <stop stop-color="#fff"/><stop offset=".26" stop-color="#99b4d7" stop-opacity=".72"/>
      <stop offset=".53" stop-color="#eafaff"/><stop offset=".77" stop-color="#c5b8ec"/>
      <stop offset="1" stop-color="#89c4d8" stop-opacity=".84"/>
    </linearGradient>
    <linearGradient id="warm" x1=".1" y1="0" x2=".84" y2="1">
      <stop stop-color="#ffc461"/><stop offset=".36" stop-color="#fb8a45"/>
      <stop offset=".74" stop-color="#d9699b"/><stop offset="1" stop-color="#9c6fd8"/>
    </linearGradient>
    <linearGradient id="violet" x1=".2" y1="0" x2=".75" y2="1">
