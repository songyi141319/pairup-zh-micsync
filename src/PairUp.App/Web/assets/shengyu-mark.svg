      <stop offset=".78" stop-color="#7163ce"/><stop offset="1" stop-color="#707ee0"/>
    </linearGradient>
    <linearGradient id="aqua" x1=".1" y1=".9" x2=".9" y2=".2">
      <stop stop-color="#627ed7"/><stop offset=".34" stop-color="#6db6ec"/>
      <stop offset=".72" stop-color="#6ee4ef"/><stop offset="1" stop-color="#b4f4ee"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#b597ed"/><stop offset=".3" stop-color="#8c96db"/>
      <stop offset=".66" stop-color="#7dd1e2"/><stop offset="1" stop-color="#ffb77b"/>
    </linearGradient>
    <radialGradient id="bead" cx=".3" cy=".2" r=".86">
