    </linearGradient>
    <radialGradient id="shadow">
      <stop stop-color="#6275ad" stop-opacity=".2"/><stop offset="1" stop-color="#6275ad" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="orbClip"><circle cx="256" cy="248" r="204"/></clipPath>
  </defs>
  <ellipse cx="256" cy="464" rx="178" ry="26" fill="url(#shadow)"/>
  <circle cx="256" cy="248" r="204" fill="url(#glass)" stroke="url(#rim)" stroke-width="4"/>
